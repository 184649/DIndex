name: Branch validation
on:
  push:
    branches: [improve/performance-reliability-20261017]
permissions:
  contents: read
jobs:
  windows-build:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows application and updater
        run: dotnet build DIndex.sln --configuration Release --no-incremental
      - name: Core regression tests
        run: dotnet run --project tests/DIndex.Core.Tests/DIndex.Core.Tests.csproj --configuration Release
      - name: Storage and updater safety tests
        run: dotnet run --project tests/StorageSafetyTests/StorageSafetyTests.csproj --configuration Release
